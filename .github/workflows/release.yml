name: Release

# Image hanya dibangun dari tag semver, bukan dari setiap push. Tag yang jadi
# sumber versi image membuat setiap image bisa ditelusuri balik ke satu commit.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  # Dibutuhkan cosign untuk keyless signing lewat OIDC GitHub, dan oleh
  # attestation provenance. Izin ini sengaja tidak diberikan di ci.yml, karena
  # tidak ada alasan setiap pull request bisa menandatangani apa pun.
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

# Semua action dipin ke commit SHA. Di workflow ini taruhannya lebih besar
# daripada di ci.yml: ia memegang `packages: write` dan `id-token: write`, jadi
# satu repo action yang diambil alih cukup untuk menandatangani image atas nama
# repo ini. Lihat S-20 di ../games-catalog/SECURE.md

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Tanpa tag `latest`. Deployment merujuk versi atau digest, supaya
          # selalu bisa dipastikan versi mana yang sedang berjalan saat insiden.
          # Lihat S-08.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Dibangun dan dimuat ke daemon lokal dulu, bukan langsung di-push.
      # Image yang gagal scan tidak boleh pernah sampai ke registry, karena tag
      # yang sudah terbit tidak bisa ditarik kembali dari mesin yang sempat
      # menariknya.
      - name: Build (belum di-push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: HIGH,CRITICAL
          # `ignore-unfixed` bukan pelonggaran gate, melainkan pemisahan antara
          # yang bisa ditindak dan yang tidak. CVE base image yang belum punya
          # patch tidak bisa diperbaiki dengan cara apa pun selain mengganti
          # base image, dan menggagalkan build karenanya hanya melatih orang
          # men-bypass gate. Lihat S-17.
          ignore-unfixed: true
          exit-code: '1'

      - id: push
        name: Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # SBOM menjawab "paket apa saja di dalam image ini" tanpa perlu
          # menjalankannya. Provenance menjawab "build ini dari commit dan
          # workflow yang mana". Lihat S-18.
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Tanda tangani image
        # Keyless lewat OIDC: tidak ada kunci privat yang perlu disimpan atau
        # dirotasi, dan identitas penandatangannya terikat pada workflow, bukan
        # pada orang. Lihat S-19.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}

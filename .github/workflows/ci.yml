name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Semua action dipin ke commit SHA, bukan tag. Tag dapat dipindahkan pemiliknya
# kapan saja, dan workflow ini berjalan dengan GITHUB_TOKEN. Komentar versi di
# sebelahnya dipertahankan supaya tetap terbaca manusia, dan Dependabot bisa
# memperbaruinya otomatis. Lihat S-20 di ../games-catalog/SECURE.md

jobs:
  verify:
    runs-on: ubuntu-latest

    # e2e memuat seluruh AppModule, sehingga PrismaService.onModuleInit
    # menjalankan $connect() saat app.init(). Tanpa Postgres yang benar-benar
    # hidup, e2e gagal sebelum satu endpoint pun disentuh. Lihat F-12.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: games
          POSTGRES_PASSWORD: games
          POSTGRES_DB: games
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://games:games@localhost:5432/games?schema=public
      # Bukan secret. Validasi env hanya mensyaratkan minimal 32 karakter, dan
      # memakai SHA commit menghindari menuliskan string yang menyerupai secret
      # ke dalam repo — supaya scanner secret tidak menemukan umpan palsu.
      JWT_SECRET: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        # `lint:ci`, bukan `lint`. Script `lint` memanggil eslint dengan --fix,
        # yang di CI berarti masalah diperbaiki diam-diam lalu dibuang bersama
        # runner — gate-nya lolos atas pekerjaan yang tidak pernah sampai ke
        # repo. `lint:ci` melaporkan tanpa memperbaiki, dan `--max-warnings 0`
        # membuat warning ikut menggagalkan.
        run: pnpm lint:ci

      - name: Build
        run: pnpm build

      - name: Migrate
        run: pnpm prisma migrate deploy

      - name: Unit test
        run: pnpm test

      - name: E2E test
        run: pnpm test:e2e

      - name: Audit dependency produksi
        # Ambang sengaja di `critical`, bukan `high`.
        #
        # Keadaan terukur 2026-08-05: 11 advisory, 0 critical, 2 high. Dua yang
        # high adalah `lodash` dan `js-yaml`, dan keduanya sudah berada di versi
        # terbaru — belum ada patch di versi mana pun. Sisanya terikat pada
        # mayor NestJS 10.
        #
        # Ambang `high` karena itu akan membuat gate ini lahir dalam keadaan
        # merah, dan gate yang selalu merah akan dibiasakan di-bypass sampai
        # kehilangan makna. Ambang `critical` bisa ditegakkan sungguhan hari ini
        # dan tetap menangkap kelas masalah yang nyata: F-13 adalah CVE critical
        # pada `tar` lewat rantai `bcrypt`.
        #
        # Menaikkan ke `high` menunggu keputusan upgrade NestJS 10 → 11.
        run: pnpm audit --prod --audit-level critical

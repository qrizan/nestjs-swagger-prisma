name: Release

# Versi image berasal dari tag, sehingga tiap image dapat ditelusuri ke satu commit.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  # Dipakai cosign untuk keyless signing lewat OIDC dan oleh attestation provenance.
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Kedua pemberitahuan ini tidak menyampaikan apa pun tentang image yang dipindai.
  TRIVY_DISABLE_VEX_NOTICE: 'true'
  TRIVY_SKIP_VERSION_CHECK: 'true'

# Action dipin ke commit SHA; komentar versi di sebelahnya untuk keterbacaan.

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Tanpa tag `latest`; deployment merujuk versi atau digest.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Dimuat ke daemon lokal dulu supaya bisa dipindai sebelum di-push.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dua langkah: yang pertama merekam seluruh temuan ke file tanpa
      # menggagalkan, yang kedua menjadi gate dan hanya melihat yang ada patch-nya.
      - name: Scan image (full report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: json
          output: trivy-report.json
          exit-code: '0'

      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: HIGH,CRITICAL
          # Hanya temuan yang punya versi perbaikan; sisanya tercatat di laporan.
          ignore-unfixed: true
          exit-code: '1'

      # `always()` supaya laporan tetap tersimpan ketika gate menolak.
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report-${{ github.ref_name }}
          path: trivy-report.json
          retention-days: 30

      # Pemindaian hanya membaca isi image, tidak membuktikan image itu jalan.
      # Langkah ini menyalakannya lebih dulu, sehingga dependensi runtime yang
      # hilang dari pohon produksi tertahan sebelum image dipublikasikan.
      # Bootstrap memanggil $connect(), jadi database harus tersedia meski
      # liveness sendiri tidak menyentuhnya.
      - name: Run image
        env:
          JWT_SECRET: ${{ github.sha }}
        run: |
          docker network create release-check
          docker run -d --name postgres --network release-check \
            -e POSTGRES_USER=games \
            -e POSTGRES_PASSWORD=games \
            -e POSTGRES_DB=games \
            --health-cmd pg_isready --health-interval 5s --health-retries 12 \
            postgres:16
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ] && break
            sleep 2
          done
          # Enam variabel S3 wajib ada supaya validasi env lolos. Tidak ada yang
          # menghubungi endpoint ini: object storage baru disentuh saat unggah
          # atau registrasi, sedangkan langkah ini hanya memanggil /health/live.
          docker run -d --name api --network release-check -p 3000:3000 \
            -e DATABASE_URL='postgresql://games:games@postgres:5432/games?schema=public' \
            -e JWT_SECRET="$JWT_SECRET" \
            -e S3_ENDPOINT='http://garage:3900' \
            -e S3_REGION='garage' \
            -e S3_BUCKET='assets' \
            -e S3_ACCESS_KEY_ID='release-check' \
            -e S3_SECRET_ACCESS_KEY='release-check' \
            -e S3_PUBLIC_BASE_URL='http://assets.localhost' \
            "${IMAGE}:ci"
          for _ in $(seq 30); do
            if curl -fsS http://localhost:3000/health/live >/dev/null; then
              echo 'image melayani /health/live'
              exit 0
            fi
            sleep 2
          done
          echo 'image tidak melayani /health/live'
          docker logs api
          exit 1

      - id: push
        name: Push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # SBOM mencatat isi image; provenance mencatat asal build-nya.
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        # Keyless lewat OIDC; identitas penandatangan terikat pada workflow,
        # bukan pada kunci yang disimpan.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: cd-token
        with:
          app-id: ${{ vars.CD_APP_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
          # token diminta untuk repo orkestrasi, bukan untuk repo ini
          owner: ${{ github.repository_owner }}
          repositories: games-catalog

      - name: Trigger CD di repo orkestrasi
        # Dijalankan setelah sign, sehingga yang di-dispatch hanya image yang
        # sudah ditandatangani. GITHUB_TOKEN bawaan tidak memicu workflow run di
        # repo lain, jadi dispatch ini memakai token instalasi GitHub App.
        env:
          GH_TOKEN: ${{ steps.cd-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          APP_REPO: ${{ github.event.repository.name }}
          GIT_TAG: ${{ github.ref_name }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          jq -n \
            --arg repo "$APP_REPO" \
            --arg git_tag "$GIT_TAG" \
            --arg image_tag "$IMAGE_TAG" \
            --arg digest "$DIGEST" \
            '{event_type: "app-released",
              client_payload: {repo: $repo, git_tag: $git_tag,
                               image_tag: $image_tag, digest: $digest}}' \
            | gh api "repos/${OWNER}/games-catalog/dispatches" --input -
          echo "OK: dispatch app-released terkirim untuk $APP_REPO $GIT_TAG"

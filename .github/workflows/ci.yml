name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Action dipin ke commit SHA; komentar versi di sebelahnya untuk keterbacaan.

jobs:
  verify:
    runs-on: ubuntu-latest

    # e2e memuat seluruh AppModule, sehingga PrismaService.onModuleInit
    # menjalankan $connect() saat app.init() dan butuh Postgres yang hidup.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: games
          POSTGRES_PASSWORD: games
          POSTGRES_DB: games
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://games:games@localhost:5432/games?schema=public
      # Nilai uji. Validasi env hanya mensyaratkan minimal 32 karakter.
      JWT_SECRET: ${{ github.sha }}
      # Wajib ada supaya validasi env lolos saat e2e memuat AppModule. Tidak ada
      # yang menghubungi endpoint ini: object storage baru disentuh saat unggah
      # atau registrasi, dan e2e hanya memanggil GET /.
      S3_ENDPOINT: http://localhost:3900
      S3_REGION: garage
      S3_BUCKET: assets
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      S3_PUBLIC_BASE_URL: http://assets.localhost

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        # `lint:ci` melaporkan tanpa memperbaiki; `lint` memakai --fix dan tidak
        # cocok untuk gate.
        run: pnpm lint:ci

      - name: Build
        run: pnpm build

      - name: Migrate
        run: pnpm prisma migrate deploy

      - name: Unit test
        run: pnpm test

      - name: E2E test
        run: pnpm test:e2e

      - name: Audit production dependencies
        # Ambang `high`. Advisory moderate yang tersisa terikat mayor NestJS 10
        # dan baru bisa ditutup lewat upgrade mayor.
        run: pnpm audit --prod --audit-level high

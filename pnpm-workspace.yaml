allowBuilds:
  '@compodoc/compodoc': false
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true

engineStrict: true

# @nestjs/platform-express@10.4.22 memin multer ke 2.0.2, dan 10.4.22 adalah
# rilis terakhir seri 10.x. Advisory DoS multer baru tertutup di 2.2.0, jadi
# versi yang dipakai FileInterceptor harus dipaksa dari sini. Hapus override
# ini kalau sudah pindah ke Nest 11, yang sudah memin 2.2.0 sendiri.
overrides:
  multer: ^2.2.0

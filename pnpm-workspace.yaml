allowBuilds:
  '@compodoc/compodoc': false
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true

engineStrict: true

# Dependency transitif yang versinya dipin paket induk, dinaikkan ke versi yang
# sudah memuat perbaikan keamanan. js-yaml ditahan di jalur 4.x agar tidak
# menyeberang mayor.
#
# path-to-regexp dibatasi ke induknya: @nestjs/serve-static mem-pin 0.2.5, yang
# rentan, sedangkan express memakai 0.1.13 dengan API berbeda dan sudah aman.
# Override tanpa cakupan akan ikut mengganti milik express dan merusak routing.
overrides:
  multer: ^2.2.0
  lodash: ^4.18.1
  js-yaml: ^4.3.1
  '@nestjs/serve-static>path-to-regexp': ^1.9.0
